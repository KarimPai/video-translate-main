name: Offline quality regression tests

on:
  push:
    branches: [main, feature/haas-plamo-quality-reliability-20261112, feature/haas-dual-asr-reconciliation, feature/haas-whisper-turbo-dual-asr-20261114]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight CPU test dependencies
        run: python -m pip install "numpy>=1.26"
      - name: Compile all Python files
        run: python -m compileall -q src tests scripts
      - name: Run offline regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v

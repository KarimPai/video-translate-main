name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked CI dependencies
        run: uv sync --locked --group ci
      - name: Lint the complete source and test trees
        run: uv run --locked --group ci ruff check src tests
      - name: Compile source and tests
        run: |
          uv run --locked --group ci python -m compileall -q src tests

  ubuntu-cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install locked CPU-only test dependencies
        run: uv sync --locked --group ci --extra gui --extra asr
      - name: Run full CPU-safe test suite
        run: uv run --locked --group ci --extra gui --extra asr python -m pytest -q

  windows-cpu-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked CPU-only test dependencies
        run: uv sync --locked --group ci --extra gui --extra asr
      - name: Run full CPU-safe test suite
        run: uv run --locked --group ci --extra gui --extra asr python -m pytest -q

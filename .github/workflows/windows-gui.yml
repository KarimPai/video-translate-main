name: Windows GUI frontend build

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [feature/qwen-plamo-optimized]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "config.example.toml"
      - "glossary.toml"
      - "Setup.bat"
      - "Start GUI.vbs"
      - "Start translate.bat"
      - ".github/workflows/windows-gui.yml"

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Keep incremental EXE patches compatible with the existing _internal.
          python-version: "3.12.10"
      - name: Install frontend build tools and lightweight offline test dependencies
        run: python -m pip install "PySide6==6.12.0" "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.10" "numpy>=1.26" "httpx>=0.27"
      - name: Run complete offline regression suite with Qt and Windows process jobs
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Test session process ownership with real Windows jobs and Qt
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -p test_session_lifecycle.py -v
      - name: GUI offscreen startup and control-state smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          @'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from auto_translate.gui import VideoTranslateWindow

          app = QApplication([])
          w = VideoTranslateWindow(Path.cwd())
          w.show()
          app.processEvents()
          assert w.quality.currentData() == 720
          assert w.memory_checkbox.isChecked() and w.memory_lines.value() == 16
          assert w.memory_lines.maximum() == 20
          assert not w.chat_checkbox.isChecked() and not w.safe_playback_checkbox.isChecked()
          assert w.diagnostics_checkbox.isChecked()
          assert not w.include_windows_events.isChecked()
          w.memory_checkbox.setChecked(False)
          assert not w.memory_lines.isEnabled()
          w.memory_checkbox.setChecked(True)
          assert w.memory_lines.isEnabled()
          w._on_player_event({"event": "diagnostics", "gpu": {}, "playback": {}})
          assert "unknown" in w.diagnostic_labels["gpu"].text().lower()
          for quality in (360, 480, 1080, 720):
              w.quality.setCurrentIndex(w.quality.findData(quality))
          w._session_ready()
          assert not w.setup_panel.isVisible()
          w._session_finished("Stopped.")
          assert w.setup_panel.isVisible()
          w.close()
          '@ | python -
      - name: Verify GUI seekbar and host fullscreen state
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          @'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from auto_translate.gui import VideoTranslateWindow

          app = QApplication([])
          window = VideoTranslateWindow(Path.cwd())
          window.show()
          app.processEvents()
          hwnd = int(window.video_surface.winId())
          window._session_ready()
          window._on_player_event({"event": "ready", "live": False, "duration": 5400.0})
          window._on_player_event({"event": "status", "live": False, "duration": 5400.0,
                                   "position": 1280.2, "paused": False})
          assert not window.seek_slider.isEnabled()
          assert not window.pause_button.isEnabled()
          assert window.seek_slider.maximum() == 5400
          assert window.seek_slider.value() == 1280
          assert window.time_label.text() == "21:20 / 1:30:00"

          import json
          import subprocess
          import sys
          import time
          from PySide6.QtCore import Qt, QPoint
          from PySide6.QtTest import QTest
          from auto_translate.gui_control import parse_event

          # Use the real windowless backend reader with deliberately closed stdin.
          options = window._listen_for_control()
          receiver = subprocess.Popen([
              str(Path(sys.executable).with_name("pythonw.exe")), "-u", "-c",
              "import sys; from auto_translate.gui_control import read_control_socket; "
              "import json; read_control_socket(int(sys.argv[1]), sys.argv[2], "
              "lambda a,v: print(json.dumps(dict(action=a,value=v)), flush=True))",
              options[1], options[3],
          ], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, text=True)
          import queue
          import threading
          lines = queue.Queue()
          def collect_output():
              for line in receiver.stdout:
                  lines.put(line)
          threading.Thread(target=collect_output, daemon=True).start()
          def wait_until(predicate):
              deadline = time.monotonic() + 8
              while not predicate():
                  assert time.monotonic() < deadline, "GUI control handshake timed out"
                  app.processEvents()
                  time.sleep(.01)
          wait_until(lambda: window._control_socket is not None)
          ready = parse_event(lines.get(timeout=5).strip())
          assert ready == {"event": "control_ready"}
          window._on_player_event(ready)
          assert window.seek_slider.isEnabled() and window.pause_button.isEnabled()
          def next_command():
              return json.loads(lines.get(timeout=5))
          window.seek_slider.setFocus()
          QTest.mouseClick(
              window.seek_slider, Qt.MouseButton.LeftButton,
              pos=QPoint(int(window.seek_slider.width() * 0.75),
                         window.seek_slider.height() // 2),
          )
          app.processEvents()
          cmd = next_command()
          assert cmd["action"] == "seek" and 3300 < cmd["value"] < 4700, cmd

          # Drag completion and keyboard control must dispatch too.
          window.seek_slider.setSliderDown(True)
          window.seek_slider.setValue(3400)
          window.seek_slider.setSliderDown(False)
          assert next_command()["value"] == 3400
          QTest.keyClick(window.seek_slider, Qt.Key.Key_Right)
          assert next_command()["value"] == window.seek_slider.value()
          window._on_player_event({"event": "seek_ack", "accepted": True, "target": 3401})
          assert window._pending_seek_target == 3401
          assert not window.status.text()

          window.fullscreen_button.setFocus()
          QTest.keyClick(window.fullscreen_button, Qt.Key.Key_F)
          app.processEvents()
          assert window.isFullScreen()
          assert not window.tabs.tabBar().isVisible()
          assert window.video_controls.isVisible(), "Fullscreen must retain playback bar"
          assert window.seek_slider.isVisible(), "Fullscreen must retain VOD seekbar"
          assert window.seek_slider.isEnabled()
          assert window.fullscreen_button.isVisible(), "Fullscreen needs visible exit button"
          assert window.fullscreen_button.text() == "Exit Fullscreen"
          assert window._fullscreen_controls_timer.isActive()

          # Space must never activate a focused Exit Fullscreen button.
          from PySide6.QtCore import QEvent
          from PySide6.QtGui import QKeyEvent
          for control in (window.fullscreen_button, window.seek_slider, window.pause_button):
              control.setFocus()
              QTest.keyClick(control, Qt.Key.Key_Space)
              assert next_command()["action"] == "pause"
              assert window.isFullScreen()
          for key in (Qt.Key.Key_F, Qt.Key.Key_Space):
              app.sendEvent(window.fullscreen_button, QKeyEvent(
                  QEvent.Type.KeyPress, key, Qt.KeyboardModifier.NoModifier, "", True, 1))
          assert window.isFullScreen()
          QTest.keyClick(window.fullscreen_button, Qt.Key.Key_F)
          assert not window.isFullScreen()
          QTest.keyClick(window.seek_slider, Qt.Key.Key_F)
          assert window.isFullScreen()

          # No pointer movement: controls hide after the inactivity timeout.
          # Direct tick keeps this test deterministic and fast.
          from PySide6.QtCore import QPoint
          from PySide6.QtGui import QCursor
          window._fullscreen_cursor_pos = QCursor.pos()
          window._fullscreen_activity_at -= window.FULLSCREEN_CONTROLS_TIMEOUT_S + 0.1
          window._fullscreen_controls_tick()
          assert not window.video_controls.isVisible(), "Idle fullscreen controls must auto-hide"
          # MPV owns the native video surface; polling global cursor movement
          # must reveal the controls without Qt mouseMove events.
          window._fullscreen_cursor_pos = QPoint(-50000, -50000)
          window._fullscreen_controls_tick()
          assert window.video_controls.isVisible(), "Moving cursor must reveal seekbar"
          assert window.seek_slider.isVisible()
          assert window.fullscreen_button.isVisible()
          # Groove clicking while fullscreen must use the same backend pipe.
          QTest.mouseClick(
              window.seek_slider, Qt.MouseButton.LeftButton,
              pos=QPoint(int(window.seek_slider.width() * 0.6),
                         window.seek_slider.height() // 2),
          )
          cmd = next_command()
          assert cmd["action"] == "seek" and 2600 < cmd["value"] < 3800, cmd

          # Do not hide the bar while the VOD seek slider is being dragged.
          window.seek_slider.setSliderDown(True)
          window._fullscreen_cursor_pos = QCursor.pos()
          window._fullscreen_activity_at -= window.FULLSCREEN_CONTROLS_TIMEOUT_S + 0.1
          window._fullscreen_controls_tick()
          assert window.video_controls.isVisible(), "Seeking must suspend auto-hide"
          window.seek_slider.setSliderDown(False)
          window.fullscreen_button.click()
          app.processEvents()
          assert not window.isFullScreen(), "Exit Fullscreen button must restore window"
          assert window.tabs.tabBar().isVisible()
          assert window.video_controls.isVisible()
          assert window.fullscreen_button.text() == "Fullscreen"
          assert not window._fullscreen_controls_timer.isActive(), "Fullscreen timer must stop on exit"
          window.toggle_fullscreen()
          app.processEvents()
          assert window.isFullScreen()
          window._on_player_event({"event": "exit_fullscreen"})
          app.processEvents()
          assert not window.isFullScreen(), "Esc forwarded from MPV must exit fullscreen"
          assert int(window.video_surface.winId()) == hwnd
          window._on_player_event({"event": "status", "live": True, "position": 30,
                                   "duration": None, "paused": False})
          assert not window.seek_slider.isEnabled()
          assert "LIVE" in window.time_label.text()
          window._on_player_event({"event": "status", "live": False, "duration": 18000})
          window._request_seek(17190)
          # Releasing the handle earlier can have queued another seek.
          while next_command() != {"action": "seek", "value": 17190}:
              pass
          receiver.terminate()
          receiver.wait(timeout=5)
          wait_until(lambda: not window._control_ready)
          assert not window.seek_slider.isEnabled() and not window.pause_button.isEnabled()
          assert "channel lost" in window.status.text()
          window.close()
          '@ | Set-Content -LiteralPath gui_controls_smoke.py -Encoding utf8
          python gui_controls_smoke.py
      - name: Verify pythonw remains windowless with working Qt output pipes
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path
          from PySide6.QtCore import QCoreApplication, QProcess

          app = QCoreApplication([])
          proc = QProcess()
          proc.setProcessChannelMode(QProcess.ProcessChannelMode.MergedChannels)
          pyw = Path(sys.executable).with_name("pythonw.exe")
          proc.start(str(pyw), [
              "-u", "-c",
              "import sys; print('GUI_PIPE_OK', flush=True); print('ERROR_PIPE_OK', file=sys.stderr, flush=True)"
          ])
          assert proc.waitForFinished(15000), proc.errorString()
          output = bytes(proc.readAllStandardOutput()).decode("utf-8")
          assert proc.exitCode() == 0, (proc.exitCode(), output)
          assert "GUI_PIPE_OK" in output and "ERROR_PIPE_OK" in output, output

          '@ | Set-Content -LiteralPath gui_pipe_smoke.py -Encoding utf8
          python gui_pipe_smoke.py
      - name: Confirm Windows helper processes create no console
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          @'
          import os
          import subprocess
          import sys

          from auto_translate.windows_subprocess import hidden_console_flags

          os.environ["VIDEO_TRANSLATE_GUI"] = "1"
          flags = hidden_console_flags()
          assert flags == subprocess.CREATE_NO_WINDOW, flags
          probe = subprocess.run(
              [sys.executable, "-c",
               "import ctypes; print(int(ctypes.windll.kernel32.GetConsoleWindow()))"],
              stdin=subprocess.DEVNULL,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              creationflags=flags,
              text=True,
              timeout=15,
              check=True,
          )
          assert probe.stdout.strip() == "0", (
              "Console window unexpectedly created for a GUI child", probe.stdout, probe.stderr
          )
          os.environ.pop("VIDEO_TRANSLATE_GUI")
          assert hidden_console_flags() == 0
          '@ | Set-Content -LiteralPath no_console_smoke.py -Encoding utf8
          python no_console_smoke.py
      - name: Validate VBS launcher syntax and console-free Qt bootstrap
        shell: pwsh
        run: |
          cscript.exe //nologo "Start GUI.vbs" --launcher-self-test
          if ($LASTEXITCODE -ne 0) { throw "VBS launcher syntax check failed" }
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:VIDEO_TRANSLATE_PROJECT_DIR = (Get-Location).Path
          python -m venv --system-site-packages .venv
          cscript.exe //nologo "Start GUI.vbs" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "VBS to pythonw GUI bootstrap failed" }
          $log = Get-Content "logs/gui-startup.log" -Raw
          if (-not $log.Contains("GUI offscreen smoke test completed")) { throw "Missing GUI bootstrap ready marker" }
      - name: Build Qt frontend EXE
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name VideoTranslate --paths src --hidden-import auto_translate.runtime_diagnostics --hidden-import auto_translate.gui src/auto_translate/gui_bootstrap.py
      - name: Include fresh-install source backend and setup in the full artifact
        shell: pwsh
        run: |
          $destination = "dist/VideoTranslate"
          foreach ($item in @('src', 'scripts', 'web', 'pyproject.toml', 'uv.lock', 'config.example.toml', 'glossary.toml', 'Setup.bat', 'Start GUI.vbs', 'Start translate.bat', 'README.md', 'GUI_SETUP.md')) {
            Copy-Item -LiteralPath $item -Destination $destination -Recurse -Force
          }
          Copy-Item -LiteralPath '.gitignore' -Destination $destination
      - name: Check packaged GUI
        shell: pwsh
        run: |
          $exe = Get-Item "dist/VideoTranslate/VideoTranslate.exe"
          $full = (Get-ChildItem "dist/VideoTranslate" -File -Recurse | Measure-Object Length -Sum).Sum
          if (-not (Test-Path "dist/VideoTranslate/_internal")) { throw "Missing packaged Qt runtime" }
          if ($exe.Length -lt 10000) { throw "Packaged frontend EXE unexpectedly small" }
          Write-Host "Incremental GUI EXE size: $([math]::Round($exe.Length / 1MB, 2)) MiB"
          Write-Host "Complete GUI runtime size: $([math]::Round($full / 1MB, 2)) MiB"
      - name: Launch the packaged executable and verify Qt startup
        shell: pwsh
        run: |
          $artifact = (Resolve-Path "dist/VideoTranslate").Path
          $exe = Join-Path $artifact 'VideoTranslate.exe'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:VIDEO_TRANSLATE_PROJECT_DIR = $artifact
          # Verify the bundled GUI can import without the source PYTHONPATH.
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WorkingDirectory $artifact -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged VideoTranslate.exe did not finish its Qt smoke test within 30 seconds'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged VideoTranslate.exe failed with exit code $($process.ExitCode)" }
          $logPath = Join-Path $artifact 'logs/gui-startup.log'
          if (-not (Test-Path -LiteralPath $logPath)) { throw 'Packaged GUI did not create its startup log' }
          $log = Get-Content -LiteralPath $logPath -Raw -Encoding utf8
          if (-not $log.Contains($exe)) { throw 'Startup log does not identify the packaged executable' }
          if (-not $log.Contains('GUI offscreen smoke test completed')) { throw 'Packaged GUI did not reach the Qt ready marker' }
          if ($log.Contains('STARTUP FAILURE')) { throw "Packaged GUI reported a startup failure: $log" }
          Write-Host 'Packaged VideoTranslate.exe launched Qt and exited successfully.'
      - name: Upload frontend EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VideoTranslate-PLaMo-EXE-Only
          path: dist/VideoTranslate/VideoTranslate.exe
          compression-level: 9
          retention-days: 30
          if-no-files-found: error
      - name: Upload full GUI (new installs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VideoTranslate-PLaMo-Windows-GUI
          path: dist/VideoTranslate/
          retention-days: 30
          if-no-files-found: error

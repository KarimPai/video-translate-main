name: Windows GUI frontend build

on:
  workflow_dispatch:
  push:
    branches: [feature/haas-whisper-turbo-dual-asr-20261114]
    paths:
      - "src/auto_translate/gui.py"
      - "src/auto_translate/gui_runner.py"
      - "src/auto_translate/gui_control.py"
      - "src/auto_translate/output/mpv.py"
      - "src/auto_translate/output/mpv_gui_input.conf"
      - "tests/test_gui_player_controls.py"
      - "src/auto_translate/gui_bootstrap.py"
      - "src/auto_translate/windows_subprocess.py"
      - "Start GUI.vbs"
      - "tests/test_gui_runner.py"
      - ".github/workflows/windows-gui.yml"

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep incremental EXE patches compatible with the existing _internal.
          python-version: "3.12.10"
      - name: Install frontend-only build tools
        run: python -m pip install "PySide6==6.12.0" "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.10"
      - name: GUI offscreen startup and control-state smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from pathlib import Path; from PySide6.QtWidgets import QApplication; from auto_translate.gui import VideoTranslateWindow; app=QApplication([]); w=VideoTranslateWindow(Path.cwd()); w.show(); app.processEvents(); assert w.quality.currentData()==720; assert not w.vsr_checkbox.isEnabled(); assert not w.vsr_checkbox.isChecked(); w.quality.setCurrentIndex(w.quality.findData(480)); assert w.vsr_checkbox.isEnabled(); w.vsr_checkbox.setChecked(True); w.quality.setCurrentIndex(w.quality.findData(720)); assert not w.vsr_checkbox.isEnabled(); w.quality.setCurrentIndex(w.quality.findData(480)); assert w.vsr_checkbox.isChecked(); w._session_ready(); assert not w.setup_panel.isVisible(); w._session_finished('Stopped.'); assert w.setup_panel.isVisible(); w.close()"
      - name: Verify GUI seekbar and host fullscreen state
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          @'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from auto_translate.gui import VideoTranslateWindow

          app = QApplication([])
          window = VideoTranslateWindow(Path.cwd())
          window.show()
          app.processEvents()
          hwnd = int(window.video_surface.winId())
          window._session_ready()
          window._on_player_event({"event": "ready", "live": False, "duration": 5400.0})
          window._on_player_event({"event": "status", "live": False, "duration": 5400.0,
                                   "position": 1280.2, "paused": False})
          assert window.seek_slider.isEnabled()
          assert window.seek_slider.maximum() == 5400
          assert window.seek_slider.value() == 1280
          assert window.time_label.text() == "21:20 / 1:30:00"

          # Exercise real Qt mouse input, not only slider values set in code.
          # A groove click formerly changed the slider without seeking MPV.
          import json
          from PySide6.QtCore import QProcess, Qt, QPoint
          from PySide6.QtTest import QTest

          class BackendProbe:
              def __init__(self):
                  self.commands = []
              def state(self):
                  return QProcess.ProcessState.Running
              def write(self, data):
                  self.commands.append(json.loads(bytes(data).decode().strip()))
                  return len(data)

          probe = BackendProbe()
          window.process = probe
          window.seek_slider.setFocus()
          QTest.mouseClick(
              window.seek_slider, Qt.MouseButton.LeftButton,
              pos=QPoint(int(window.seek_slider.width() * 0.75),
                         window.seek_slider.height() // 2),
          )
          app.processEvents()
          assert probe.commands[-1]["action"] == "seek", probe.commands
          assert 3300 < probe.commands[-1]["value"] < 4700, probe.commands

          # Drag completion and keyboard control must dispatch too.
          window.seek_slider.setSliderDown(True)
          window.seek_slider.setValue(3400)
          window.seek_slider.setSliderDown(False)
          assert probe.commands[-1]["value"] == 3400
          QTest.keyClick(window.seek_slider, Qt.Key.Key_Right)
          assert probe.commands[-1]["value"] == window.seek_slider.value()
          window._on_player_event({"event": "seek_ack", "accepted": True, "target": 3401})
          assert window._pending_seek_target == 3401

          window.toggle_fullscreen()
          app.processEvents()
          assert window.isFullScreen()
          assert not window.tabs.tabBar().isVisible()
          assert window.video_controls.isVisible(), "Fullscreen must retain playback bar"
          assert window.seek_slider.isVisible(), "Fullscreen must retain VOD seekbar"
          assert window.seek_slider.isEnabled()
          assert window.fullscreen_button.isVisible(), "Fullscreen needs visible exit button"
          assert window.fullscreen_button.text() == "Exit Fullscreen"
          assert window._fullscreen_controls_timer.isActive()

          # No pointer movement: controls hide after the inactivity timeout.
          # Direct tick keeps this test deterministic and fast.
          from PySide6.QtCore import QPoint
          from PySide6.QtGui import QCursor
          window._fullscreen_cursor_pos = QCursor.pos()
          window._fullscreen_activity_at -= window.FULLSCREEN_CONTROLS_TIMEOUT_S + 0.1
          window._fullscreen_controls_tick()
          assert not window.video_controls.isVisible(), "Idle fullscreen controls must auto-hide"
          # MPV owns the native video surface; polling global cursor movement
          # must reveal the controls without Qt mouseMove events.
          window._fullscreen_cursor_pos = QPoint(-50000, -50000)
          window._fullscreen_controls_tick()
          assert window.video_controls.isVisible(), "Moving cursor must reveal seekbar"
          assert window.seek_slider.isVisible()
          assert window.fullscreen_button.isVisible()
          # Groove clicking while fullscreen must use the same backend pipe.
          QTest.mouseClick(
              window.seek_slider, Qt.MouseButton.LeftButton,
              pos=QPoint(int(window.seek_slider.width() * 0.6),
                         window.seek_slider.height() // 2),
          )
          assert probe.commands[-1]["action"] == "seek"
          assert 2600 < probe.commands[-1]["value"] < 3800

          # Do not hide the bar while the VOD seek slider is being dragged.
          window.seek_slider.setSliderDown(True)
          window._fullscreen_cursor_pos = QCursor.pos()
          window._fullscreen_activity_at -= window.FULLSCREEN_CONTROLS_TIMEOUT_S + 0.1
          window._fullscreen_controls_tick()
          assert window.video_controls.isVisible(), "Seeking must suspend auto-hide"
          window.seek_slider.setSliderDown(False)
          window.fullscreen_button.click()
          app.processEvents()
          assert not window.isFullScreen(), "Exit Fullscreen button must restore window"
          assert window.tabs.tabBar().isVisible()
          assert window.video_controls.isVisible()
          assert window.fullscreen_button.text() == "Fullscreen"
          assert not window._fullscreen_controls_timer.isActive(), "Fullscreen timer must stop on exit"
          window.toggle_fullscreen()
          app.processEvents()
          assert window.isFullScreen()
          window._on_player_event({"event": "exit_fullscreen"})
          app.processEvents()
          assert not window.isFullScreen(), "Esc forwarded from MPV must exit fullscreen"
          assert int(window.video_surface.winId()) == hwnd
          window._on_player_event({"event": "status", "live": True, "position": 30,
                                   "duration": None, "paused": False})
          assert not window.seek_slider.isEnabled()
          assert "LIVE" in window.time_label.text()
          window.process = None
          window.close()
          '@ | Set-Content -LiteralPath gui_controls_smoke.py -Encoding utf8
          python gui_controls_smoke.py
      - name: Verify pythonw remains windowless with working Qt output pipes
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path
          from PySide6.QtCore import QCoreApplication, QProcess

          app = QCoreApplication([])
          proc = QProcess()
          proc.setProcessChannelMode(QProcess.ProcessChannelMode.MergedChannels)
          pyw = Path(sys.executable).with_name("pythonw.exe")
          proc.start(str(pyw), [
              "-u", "-c",
              "import sys; print('GUI_PIPE_OK', flush=True); print('ERROR_PIPE_OK', file=sys.stderr, flush=True)"
          ])
          assert proc.waitForFinished(15000), proc.errorString()
          output = bytes(proc.readAllStandardOutput()).decode("utf-8")
          assert proc.exitCode() == 0, (proc.exitCode(), output)
          assert "GUI_PIPE_OK" in output and "ERROR_PIPE_OK" in output, output

          # Confirm a windowless Python backend can receive Qt seek commands.
          receiver = QProcess()
          receiver.start(str(pyw), [
              "-u", "-c",
              "import sys; line=sys.stdin.buffer.readline(); sys.stdout.buffer.write(line); sys.stdout.buffer.flush()"
          ])
          assert receiver.waitForStarted(15000), receiver.errorString()
          expected = b'{"action":"seek","value":42}\n'
          assert receiver.write(expected) == len(expected)
          assert receiver.waitForFinished(15000), receiver.errorString()
          assert bytes(receiver.readAllStandardOutput()) == expected
          '@ | Set-Content -LiteralPath gui_pipe_smoke.py -Encoding utf8
          python gui_pipe_smoke.py
      - name: Confirm Windows helper processes create no console
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          @'
          import os
          import subprocess
          import sys

          from auto_translate.windows_subprocess import hidden_console_flags

          os.environ["VIDEO_TRANSLATE_GUI"] = "1"
          flags = hidden_console_flags()
          assert flags == subprocess.CREATE_NO_WINDOW, flags
          probe = subprocess.run(
              [sys.executable, "-c",
               "import ctypes; print(int(ctypes.windll.kernel32.GetConsoleWindow()))"],
              stdin=subprocess.DEVNULL,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              creationflags=flags,
              text=True,
              timeout=15,
              check=True,
          )
          assert probe.stdout.strip() == "0", (
              "Console window unexpectedly created for a GUI child", probe.stdout, probe.stderr
          )
          os.environ.pop("VIDEO_TRANSLATE_GUI")
          assert hidden_console_flags() == 0
          '@ | Set-Content -LiteralPath no_console_smoke.py -Encoding utf8
          python no_console_smoke.py
      - name: Validate VBS launcher syntax and console-free Qt bootstrap
        shell: pwsh
        run: |
          cscript.exe //nologo "Start GUI.vbs" --launcher-self-test
          if ($LASTEXITCODE -ne 0) { throw "VBS launcher syntax check failed" }
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:VIDEO_TRANSLATE_PROJECT_DIR = (Get-Location).Path
          python -m venv --system-site-packages .venv
          cscript.exe //nologo "Start GUI.vbs" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "VBS to pythonw GUI bootstrap failed" }
          $log = Get-Content "logs/gui-startup.log" -Raw
          if (-not $log.Contains("GUI offscreen smoke test completed")) { throw "Missing GUI bootstrap ready marker" }
      - name: Build Qt frontend EXE
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name VideoTranslate --paths src src/auto_translate/gui.py
      - name: Check incremental GUI patch
        shell: pwsh
        run: |
          $exe = Get-Item "dist/VideoTranslate/VideoTranslate.exe"
          $full = (Get-ChildItem "dist/VideoTranslate" -File -Recurse | Measure-Object Length -Sum).Sum
          if (-not (Test-Path "dist/VideoTranslate/_internal")) { throw "Missing packaged Qt runtime" }
          if ($exe.Length -lt 10000) { throw "Packaged frontend EXE unexpectedly small" }
          Write-Host "Incremental GUI EXE size: $([math]::Round($exe.Length / 1MB, 2)) MiB"
          Write-Host "Complete GUI runtime size: $([math]::Round($full / 1MB, 2)) MiB"
      - name: Upload small EXE-only update
        uses: actions/upload-artifact@v4
        with:
          name: VideoTranslate-EXE-Only
          path: dist/VideoTranslate/VideoTranslate.exe
          compression-level: 9
          retention-days: 30
          if-no-files-found: error
      - name: Upload full GUI (new installs)
        uses: actions/upload-artifact@v4
        with:
          name: VideoTranslate-Windows-GUI
          path: dist/VideoTranslate/
          retention-days: 30
          if-no-files-found: error

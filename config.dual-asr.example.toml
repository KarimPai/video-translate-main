# Copy sections into your existing config.toml to override defaults.
[dual_asr]
enabled = true
# Whisper Turbo is Japanese-only; the independent CPU filter drops confident EN/ID audio.
# There is no secondary language-routing toggle.
secondary_model = "h2oai/faster-whisper-large-v3-turbo"
secondary_device = "cuda"
secondary_compute_type = "int8_float16"
secondary_beam_size = 6
# Legacy compatibility setting; name prompts are disabled even if set true.
whisper_name_hints = false
secondary_live_mode = "selective" # off, selective, all
secondary_vod_mode = "all"
live_timeout_s = 5.0
vod_timeout_s = 25.0 # Retained for accuracy; discarded cues interrupt the worker early.

[reconciler]
enabled = true
gpu_layers = 99
live_timeout_s = 4.0
vod_timeout_s = 20.0

[gpu_budget]
# No artificial VRAM hard limit; monitor physical GPU free memory.
startup_headroom_gb = 0.65
low_free_gb = 0.55
emergency_free_gb = 0.25
sample_interval_s = 2.0

[vad]
# FireRedVAD stays the same model, now on CPU to avoid PyTorch CUDA overhead.
device = "cpu"

[language_filter]
# Drop confidently English or Indonesian VAD utterances BEFORE Japanese ASR.
# Uncertain/short and Japanese speech continue unchanged.
# Uses CPU-only VoxLingua107 ECAPA INT8 (~27MB, auto-downloaded once).
enabled = true
min_duration_s = 2.5
max_window_s = 5.0
drop_probability = 0.80
max_japanese_probability = 0.12
min_top_margin = 0.45


[translate]
cue_timeout_s = 75.0
# Accuracy-first OverlaySubs-style context. Use legacy to restore previous behavior.
context_profile = "compact" # compact, legacy
context_lines = 3
memory_lines = 0
# Only split long multi-sentence Japanese at reliable written punctuation.
sentence_context = true

# Whisper does not receive static character-name prompts. The glossary only
# normalizes names that actually appear in the Japanese transcript.

[preview]
enabled = false
interval_s = 1.5
window_s = 8.0
min_agreement = 2

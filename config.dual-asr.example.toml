# Copy sections into your existing config.toml to override defaults.
[dual_asr]
enabled = true
# Parakeet JA does not support language identification or English passthrough.
# Set false to restore the original Japanese-only ASR pipeline.
language_routing = false
# Unsupported/uncertain languages are not force-translated.
secondary_live_mode = "selective" # off, selective, all
secondary_vod_mode = "all"
live_timeout_s = 2.0
vod_timeout_s = 25.0

[reconciler]
enabled = true
gpu_layers = 99
live_timeout_s = 4.0
vod_timeout_s = 20.0

[gpu_budget]
# No artificial VRAM hard limit; monitor physical GPU free memory.
startup_headroom_gb = 0.65
low_free_gb = 0.55
emergency_free_gb = 0.25
sample_interval_s = 2.0

[vad]
# FireRedVAD stays on CPU to avoid PyTorch CUDA overhead.
device = "cpu"
# Opt-in A/B test for dense GTA conversations:
# true = VOD soft 11s / hard 13s, seek natural pauses from 7.5s.
# false (default) = VOD soft 14s / hard 16s; livestream unchanged.
vod_short_segments = false

[language_filter]
# Drop confidently English or Indonesian VAD utterances BEFORE Japanese ASR.
# Uncertain/short and Japanese speech continue unchanged.
# Uses CPU-only VoxLingua107 ECAPA INT8 (~27MB, auto-downloaded once).
enabled = true
min_duration_s = 2.5
max_window_s = 5.0
drop_probability = 0.80
max_japanese_probability = 0.12
min_top_margin = 0.45


# Universal Video Translator — Configuration
# Relative paths are resolved from the project directory.

# Model selection: choose the ASR and translation backend by name.
# Available backends are registered in the model registry.
[models]
asr_backend = "haas"            # ASR backend: "haas" (Haas-ja-v1.0 via speech.cpp)
translate_backend = "gemma4"    # Translation backend: "gemma4" or "plamo"
# translate_backend = "plamo"   # PLaMo 3 Translate 2B (lighter, ~1.8GB VRAM)

# Common ASR settings (shared across backends; backend-specific overrides below)
[asr]
model_path = "haas-ja-v1.0"
server_path = ""
speech_server_path = ""
cuda_device = 0
threads = 4
context = ""
max_context_chars = 2000
recent_context_lines = 0
context_retry_limit = 1
context_size = 4096
startup_timeout_s = 180
response_timeout_s = 30
live_response_timeout_s = 15
blocklist = []

# Common translation settings (shared across backends; backend-specific overrides below)
[translate]
model_path = "models/gemma4/google_gemma-4-E4B-it-Q4_K_M.gguf"
server_path = ".runtime/llama-b12318-cuda12/llama-server.exe"
gpu_layers = 42
context_size = 4096
cuda_device = 0
threads = 4
max_tokens = 128
temperature = 0.0
top_k = 20
top_p = 0.6
repeat_penalty = 1.05
context_lines = 6
max_context_chars = 600
context_max_gap_s = 15.0
context_english = false
style = "Plain and concise"
merge_fragments = true
merge_max_gap_s = 0.6
merge_max_s = 16.0
live_merge_margin_s = 1.5
timeout_s = 30
load_timeout_s = 300
glossary = "glossary.toml"
remove_fillers = true
collapse_repetitions = true
max_identical_cues = 2
suppress_empty_translation = true
suppress_japanese_in_english = true
vod_merge_timeout_s = 5.0

# Backend-specific overrides (optional — only values that differ from common settings)
# [asr.haas]
# model_path = "haas-ja-v1.0"

# [translate.gemma4]
# gpu_layers = 42
# context_size = 4096
# max_tokens = 128
# load_timeout_s = 300

# PLaMo 3 Translate profile — lighter model, ~1.8GB VRAM
# Requires llama.cpp 0.7.0+ for the plamo3 tokenizer
# Place chat_template.jinja next to the model file for best results
# To use PLaMo, set translate_backend = "plamo" in [models] and uncomment:
# [translate.plamo]
# model_path = "models/plamo3/plamo-3-translate-2b-Q4_K_M.gguf"
# gpu_layers = -1
# context_size = 8192
# max_tokens = 256
# load_timeout_s = 180

# Qwen3-ASR profile — multimodal ASR via llama.cpp (~2GB VRAM for 1.7B model)
# Requires both a model GGUF and an audio projector (mmproj) GGUF
# To use Qwen3-ASR, set asr_backend = "qwen3-asr" in [models] and uncomment:
# [asr.qwen3-asr]
# model_path = "models/qwen3-asr/Qwen3-ASR-1.7B-Q8_0.gguf"
# mmproj_path = "models/qwen3-asr/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf"
# server_path = ".runtime/llama-b12318-cuda12/llama-server.exe"
# threads = 4
# cuda_device = 0
# startup_timeout_s = 180

# Hy-MT2 7B profile — multilingual translation model (~4.5GB VRAM)
# Uses Chinese prompt templates; no system prompt needed
# To use Hy-MT2, set translate_backend = "hymt" in [models] and uncomment:
# [translate.hymt]
# model_path = "models/hy-mt/Hy-MT2-7B-Q4_K_M.gguf"
# gpu_layers = -1
# context_size = 4096
# max_tokens = 128
# load_timeout_s = 300

# Whisper Large-v3 Turbo profile — multilingual ASR via faster-whisper (~1.7GB VRAM on CUDA)
# Runs in-process (no server needed), supports CPU and CUDA
# Model is downloaded from Hugging Face on first use (Systran/faster-whisper-large-v3-turbo)
# To use Whisper, set asr_backend = "whisper" in [models] and uncomment:
# [asr.whisper]
# model_path = ""
# threads = 4
# cuda_device = 0
# startup_timeout_s = 120

[gpu_budget]
startup_headroom_gb = 0.25
low_free_gb = 0.25
emergency_free_gb = 0.25
sample_interval_s = 3.0

[vad]
device = "cpu"
threshold = 0.24
neg_threshold = 0.16
min_silence_ms = 400
speech_pad_ms = 300
min_speech_ms = 120
short_reply_ms = 80
short_reply_probability = 0.85
onset_ms = 20
prob_smooth_frames = 3
max_utterance_s = 14.0
max_split_extension_s = 2.0
live_max_utterance_s = 7.0
live_max_split_extension_s = 1.0
adaptive_split = true
adaptive_split_s = 5.0
live_adaptive_split_s = 4.0
adaptive_pause_ms = 180
split_pause_min_ms = 120
split_context_ms = 160
fallback_s = 0.0

[language_filter]
enabled = false
min_duration_s = 2.5
max_window_s = 5.0
drop_probability = 0.80
max_japanese_probability = 0.12
min_top_margin = 0.45

[mpv]
hwdec = "auto-safe"
live_forward_cache_mib = 1024
live_back_cache_mib = 1024
en_size = 32
min_subtitle_duration_s = 1.5
reading_cps = 15
max_subtitle_duration_s = 7.0
max_line_chars = 42
max_cue_lines = 2
max_subtitle_rows = 4
background_opacity = 0.3
vod_pause_threshold_s = 0.5
vod_resume_threshold_s = 3.0

[holodex]
api_key = ""
timeout_s = 5.0

[safe_playback]
enabled = true
max_inference_concurrency = 2
queue_size = 16
audio_chunks = 48
max_audio_lead_s = 30.0

[diagnostics]
enabled = true
sample_interval_s = 4.0
max_bytes = 2000000
backups = 3

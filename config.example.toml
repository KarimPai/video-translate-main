# Copy sections into your existing config.toml to override defaults.
[dual_asr]
enabled = true
# Whisper Turbo is Japanese-only; the independent CPU filter drops confident EN/ID audio.
# There is no secondary language-routing toggle.
secondary_model = "h2oai/faster-whisper-large-v3-turbo"
secondary_device = "cuda"
secondary_compute_type = "int8_float16"
secondary_beam_size = 6
# Legacy compatibility setting; name prompts are disabled even if set true.
whisper_name_hints = false
secondary_live_mode = "selective" # off, selective, all
secondary_vod_mode = "all"
live_timeout_s = 5.0
vod_timeout_s = 25.0 # Retained for accuracy; discarded cues interrupt the worker early.
# Only meaningful disagreements with localized weak audio may get a crop retry.
smart_correction = true
correction_vod_retries = 1 # 0..2; no extra permanently loaded model
correction_live_retries = 0 # disabled for live by default
correction_vod_budget_s = 8.0
correction_live_budget_s = 2.0

[reconciler]
enabled = true
gpu_layers = 99
live_timeout_s = 4.0
vod_timeout_s = 20.0

[gpu_budget]
# No artificial VRAM hard limit; monitor physical GPU free memory.
startup_headroom_gb = 0.65
low_free_gb = 0.55
emergency_free_gb = 0.25
sample_interval_s = 2.0

[vad]
# FireRedVAD stays the same model, now on CPU to avoid PyTorch CUDA overhead.
device = "cpu"

[language_filter]
# Drop confidently English or Indonesian VAD utterances BEFORE Japanese ASR.
# Uncertain/short and Japanese speech continue unchanged.
# Uses CPU-only VoxLingua107 ECAPA INT8 (~27MB, auto-downloaded once).
enabled = true
min_duration_s = 2.5
max_window_s = 5.0
drop_probability = 0.80
max_japanese_probability = 0.12
min_top_margin = 0.45


[translate]
# Accuracy-first OverlaySubs-style context. Use legacy to restore previous behavior.
context_profile = "compact" # compact, legacy
context_lines = 3
extended_memory = true
memory_lines = 16 # bounded rolling history, 0..20; 10..20 recommended
# Only split long multi-sentence Japanese at reliable written punctuation.
sentence_context = true

# Whisper does not receive static character-name prompts. The glossary only
# normalizes names that actually appear in the Japanese transcript.

[asr]
startup_timeout_s = 120
response_timeout_s = 24
live_response_timeout_s = 12

[mpv]
live_forward_cache_mib = 1024
live_back_cache_mib = 1024

[chat]
# Public YouTube chat is weak evidence for terms already present in ASR.
# Never turns chat messages into spoken subtitles; missing chat never blocks ASR.
enabled = false
window_s = 30.0
max_messages = 100
poll_interval_s = 5.0
# Live PCM receipt is an estimate; delay uncertain messages by this allowance.
# This cannot prove the actual upstream encoder/network delay.
live_time_uncertainty_s = 5.0 # 0..120 seconds

[safe_playback]
# Serialize heavy inference while MPV keeps its configured hardware decoding.
# RTX VSR stays independent; playback resolution is never reduced silently.
enabled = false
max_inference_concurrency = 1
queue_size = 4
audio_chunks = 32
max_audio_lead_s = 20.0

[diagnostics]
enabled = true
sample_interval_s = 2.0
max_bytes = 2000000
backups = 3

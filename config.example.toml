# Copy to config.toml. Relative paths are resolved from the project directory.
# YouTube/MPV audio -> CPU FireRedVAD -> CUDA Voxtral -> PLaMo -> subtitles.
[asr]
voxtral_model_path = "models/voxtral/voxtral-mini-4b-realtime-2602-q4_k.gguf"
voxtral_server_path = ".runtime/audio-v0.9.5-cuda12/audiocpp_server.exe"
cuda_device = 0
threads = 8
startup_timeout_s = 180
response_timeout_s = 45
live_response_timeout_s = 20
# Optional exact phrases to suppress in recognized text.
blocklist = []
# The service keeps the checkpoint resident and transcribes complete utterances.
# Greedy decoding and a fixed seed are configured by the backend.

[gpu_budget]
# Decimal GB of actual device free memory, sampled through NVML/nvidia-smi.
# Aim for about 0.7-1 GiB free; reduce PLaMo GPU offload before sacrificing ASR.
startup_headroom_gb = 1.0
low_free_gb = 0.75
emergency_free_gb = 0.25
sample_interval_s = 2.0

[vad]
# FireRedVAD stays on CPU; initial segmentation preserves short reactions.
device = "cpu"
threshold = 0.30
neg_threshold = 0.20
min_silence_ms = 550
speech_pad_ms = 400
min_speech_ms = 160
short_reply_ms = 120
short_reply_probability = 0.85
onset_ms = 30
prob_smooth_frames = 5
max_utterance_s = 14.0
max_split_extension_s = 2.0
live_max_utterance_s = 7.0
live_max_split_extension_s = 1.0
adaptive_split = true
adaptive_split_s = 6.5
live_adaptive_split_s = 4.0
adaptive_pause_ms = 180
split_pause_min_ms = 120
split_context_ms = 160
fallback_s = 0.0

[language_filter]
# CPU-only VoxLingua107 ECAPA INT8 (~27MB); uncertain and short speech survives.
# Drop only confidently non-Japanese speech before Japanese ASR.
enabled = true
min_duration_s = 2.5
max_window_s = 5.0
drop_probability = 0.80
max_japanese_probability = 0.12
min_top_margin = 0.45

[translate]
# PLaMo uses adaptive partial GPU offload and CPU fallback.
plamo_hf_model = "pfnet/plamo-3-translate-2b-GGUF:Q4_K_M"
plamo_context = 4096
plamo_gpu_layers = 99
context_profile = "compact"
context_lines = 3
extended_memory = true
memory_lines = 16
sentence_context = true
glossary = "glossary.toml"
neutral_subjects = true

[mpv]
hwdec = "auto-safe"
live_forward_cache_mib = 1024
live_back_cache_mib = 1024

[chat]
# Public YouTube chat is weak evidence for terms already present in speech.
# Chat is never converted into subtitles and missing chat never blocks ASR.
enabled = false
window_s = 30.0
max_messages = 100
poll_interval_s = 5.0
live_time_uncertainty_s = 5.0

[safe_playback]
# Serialize heavy inference and bound queues while MPV retains its resolution.
enabled = false
max_inference_concurrency = 1
queue_size = 4
audio_chunks = 32
max_audio_lead_s = 20.0

[diagnostics]
enabled = true
sample_interval_s = 2.0
max_bytes = 2000000
backups = 3

stats_interval_s = 30

[separation]
enabled = false
model = "pretrained_models/separation/UVR-MDX-NET-Voc_FT.onnx"

[ingest]
ytdlp_format = "bestaudio/93/best"
cookies_from_browser = ""

[vad]
threshold = 0.4
neg_threshold = 0.30
speech_pad_ms = 250
min_silence_ms = 280
min_speech_ms = 160
max_utterance_s = 5.0
fallback_s = 0
fallback_min_s = 1.0
fallback_min_db = -45.0

[asr]
backend = "haas"
qwen_model = "jaykwok/Qwen3-ASR-0.6B-JA-Anime-Galgame"
model = "mobiuslabsgmbh/faster-whisper-large-v3-turbo"
device = "cuda"
compute_type = "float16"
beam_size = 6
initial_prompt = "これはホロライブの配信です。星街すいせい、兎田ぺこら、宝鐘マリン、さくらみこ、白上フブキ、湊あくあ、博衣こより、獅白ぼたんなどのメンバーが話しています。ゲーム配信、雑談、歌、スーパーチャット、コメント、コラボなどの話題が含まれます。"
no_speech_threshold = 0.65
log_prob_threshold = -0.75
parakeet_model = "models/parakeet-ja/sherpa-onnx-nemo-parakeet-tdt_ctc-0.6b-ja-35000-int8"
parakeet_threads = 2

[translate]
preset = "hymt2"
context_lines = 8
glossary = "glossary.toml"

# Lightweight CPU translation
[translate.presets.light]
backend = "ct2"
model = "gaudi/opus-mt-ja-en-ctranslate2"
source_spm = "source.spm"
target_spm = "target.spm"
device = "cuda"
compute_type = "int8"

# Sugoi Japanese-English translation
[translate.presets.light-sugoi]
backend = "ct2"
model = "entai2965/sugoi-v4-ja-en-ctranslate2"
source_spm = "spm/spm.ja.nopretok.model"
target_spm = "spm/spm.en.nopretok.model"
device = "cuda"
compute_type = "float16"

# Balanced Gemma 4 E4B
[translate.presets.balanced]
backend = "openai-compat"
base_url = "http://127.0.0.1:11434/v1"
model = "hololive-gemma-4b"
extra_body = { reasoning_effort = "none" }

# Quality Qwen3.5 9B
[translate.presets.quality]
backend = "openai-compat"
base_url = "http://127.0.0.1:11434/v1"
model = "hololive-qwen"
extra_body = { reasoning_effort = "none" }

[translate.presets.gemini]
backend = "openai-compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-3.5-flash-lite"
api_key_env = "GEMINI_API_KEY"
temperature = 0.2
max_tokens = 120
timeout_s = 20.0
load_timeout_s = 60.0
extra_body = { reasoning_effort = "minimal" }

[translate.presets.hymt2]
backend = "openai-compat"
base_url = "http://127.0.0.1:11434/v1"
model = "kaelri/hy-mt2:1.8b-q4_K_M"
temperature = 0.7
max_tokens = 120
timeout_s = 5.0
load_timeout_s = 300.0
min_request_interval_s = 0.0
extra_body = { top_p = 0.6 }

[output]
terminal = true
web = true
web_host = "0.0.0.0"
web_port = 8765

[mpv]
enabled = true
path = ""
delay_s = 20
start_wait_s = 3.0
port = 9137
hwdec = "auto-safe"
ytdlp_format = "bv*[height<=1080][vcodec^=avc1][protocol^=m3u8]+ba[protocol^=m3u8]/b[height<=1080][protocol^=m3u8]/b[protocol^=m3u8]"
en_size = 28
ja_size = 0
min_display_s = 1.5
hold_s = 1.0

# Speaker diarization and subtitle display
speaker_diarization = true
speaker_device = "cuda"
max_speakers = 3
max_subtitle_rows = 6

[deepfilter]
enabled = true


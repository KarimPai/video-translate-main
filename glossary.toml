# Stream topics, enabled when the title or tags contain a "match" word.
# "asr" words bias speech recognition toward the topic's vocabulary;
# "terms" are added to the translation glossary for that stream only.
[topics.gta6]
# Only activate character-name candidates for GTA VI, not generic GTA V/HoloGTA.
match = ["GTA6", "GTA 6", "GTA VI", "Grand Theft Auto VI", "グラセフ6", "グラセフ６"]
asr = ["ジェイソン", "ルシア"]

[topics.gta6.terms]
"ジェイソン" = "Jason"
"ルシア" = "Lucia"

[topics.gta]
match = ["GTA", "グラセフ", "ストグラ"]
# The first four are broad recognition hints. Title matches take precedence.
asr = ["銀行強盗", "無線", "救急隊", "指名手配", "店舗強盗", "宝石店強盗", "コンビニ強盗", "現着", "応援", "犯人", "パトカー"]

[topics.gta.terms]
"店舗強盗" = "store robbery"
"銀行強盗" = "bank robbery"
"宝石店強盗" = "jewelry store robbery"

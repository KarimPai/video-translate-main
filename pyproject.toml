[project]
name = "auto-translate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alansekha", email = "alansekha1905@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "audio-separator>=0.48.0",
    "audioread>=3.1.0",
    "deepfilternet-rs>=0.1.1",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "onnxruntime-gpu[cuda,cudnn]>=1.31.1",
    "pyannote-audio>=4.0.7",
    "sentencepiece>=0.2.2",
    "torch==2.15.0",
    "torchvision==0.29.2",
]

[project.optional-dependencies]
diarization = [
    "speechbrain>=1.0.3",
    "torchaudio==2.11.1",
]

[project.scripts]
auto-translate = "auto_translate.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/test/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-cu132" }

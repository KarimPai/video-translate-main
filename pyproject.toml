[project]
name = "auto-translate"
version = "0.1.0"
description = "Modular video translation application with interchangeable ASR and translation models"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "silero-vad-lite>=0.4.0",
    "httpx>=0.27",
    "huggingface-hub>=0.34.0",
    "yt-dlp==2026.11.23",
]

[dependency-groups]
ci = ["numpy>=1.26", "httpx>=0.27", "ruff>=0.9", "pytest>=8.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
diagnostics = ["nvidia-ml-py>=12.560.30,<14"]
asr = ["faster-whisper>=1.0.0"]

[project.scripts]
video-translate = "auto_translate.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]

[tool.ruff.lint]
per-file-ignores = {"tests/*.py" = ["BLE001"]}

[project]
name = "auto-translate"
version = "0.1.0"
description = "Japanese YouTube captions to English MPV subtitles using local PLaMo 3 Translate 8B"
readme = "README.md"
authors = [
    { name = "alansekha", email = "alansekha1905@gmail.com" }
]
requires-python = ">=3.12"
# Caption-only runtime: MPV, yt-dlp and CUDA-enabled llama-server are external
# commands. Python does not need ASR, VAD, ONNX, CUDA torch or enhancement libs.
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
auto-translate = "auto_translate.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[project]
name = "auto-translate"
version = "0.1.0"
description = "Offline VoicePing Qwen3 direct Japanese-to-English AST MPV subtitles"
readme = "README.md"
authors = [
    { name = "alansekha", email = "alansekha1905@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.4",
    "qwen-asr",
    "torch>=2.6.0",
    "transformers>=4.57.0",
    "librosa>=0.10.2",
    "fireredvad[gpu]>=0.0.2",
    "huggingface-hub>=0.34.0",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "onnxruntime-gpu[cuda,cudnn]>=1.31.1",
]

[project.optional-dependencies]
# Install only the heavy runtime packages for features you actually enable.
separation = [
    "audio-separator>=0.48.0",
    "scipy",
    "soundfile",
    "torch==2.15.0",
]

[project.scripts]
auto-translate = "auto_translate.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/test/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-cu132" }

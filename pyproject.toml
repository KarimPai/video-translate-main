[project]
name = "auto-translate"
version = "0.1.0"
description = "Local Japanese-to-English subtitles for live streams and VOD using BuzzASR and Hy-MT2"
readme = "README.md"
authors = [
    { name = "alansekha", email = "alansekha1905@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "audioread>=3.1.0",
    "fireredvad[cpu]>=0.0.2",
    "httpx>=0.27",
    "huggingface-hub>=0.34.0",
    "onnxruntime>=1.31.1",
]

[dependency-groups]
ci = ["numpy>=1.26", "httpx>=0.27", "ruff>=0.9"]

[project.optional-dependencies]
# Lightweight frontend; CLI installs do not require Qt.
gui = ["PySide6>=6.8,<7"]
# Optional NVIDIA telemetry. Playback/translation still work without NVML.
diagnostics = ["nvidia-ml-py>=12.560.30,<14"]
# Install only the heavy runtime packages for features you actually enable.
separation = [
    "audio-separator>=0.48.0",
    "scipy",
    "soundfile",
    "torch",
]
deepfilter = [
    "deepfilternet-rs>=0.1.1",
    "scipy",
]

[project.scripts]
auto-translate = "auto_translate.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

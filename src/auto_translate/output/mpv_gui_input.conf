# MPV keys for a Qt-embedded player: fullscreen belongs to the Qt host.
# Never ask MPV --wid to fullscreen its child window: request host fullscreen.
# VOD seeking continues through the backend so audio/ASR are resynchronized.
LEFT            script-message auto-translate-jump -10
RIGHT           script-message auto-translate-jump 10
Shift+LEFT      script-message auto-translate-jump -300
Shift+RIGHT     script-message auto-translate-jump 300
SPACE           script-message auto-translate-gui-pause
p               script-message auto-translate-gui-pause
m               no-osd cycle mute
UP              no-osd add volume 5
DOWN            no-osd add volume -5
WHEEL_UP        no-osd add volume 5
WHEEL_DOWN      no-osd add volume -5
9               no-osd add volume -5
0               no-osd add volume 5
f               script-message auto-translate-gui-fullscreen
F11             script-message auto-translate-gui-fullscreen
MBTN_LEFT_DBL   script-message auto-translate-gui-fullscreen
ESC             script-message auto-translate-gui-exit-fullscreen
q               quit
Q               quit
CLOSE_WIN       quit

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisper Large-v3 AST — English Subtitles</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, Segoe UI, sans-serif; }
  body { margin: 0; background: #0b0d12; color: #fff; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 20px;
           background: #171a21; font-size: 14px; }
  header strong { font-size: 15px; }
  #status { margin-left: auto; color: #c2cadb; }
  #lines { display: flex; flex-direction: column-reverse; gap: 14px;
           padding: 25px; min-height: 45vh; }
  .cue { background: rgba(28,33,45,.95); padding: 14px 18px;
         border-radius: 8px; max-width: 1000px; }
  .stamp { font-size: 12px; color: #abb9ca; margin-bottom: 7px; }
  .en { font-size: clamp(19px, 3vw, 30px); line-height: 1.35; overflow-wrap: anywhere; }
  #empty { color: #abb9ca; font-size: 17px; }
</style>
</head>
<body>
<header>
  <strong>Whisper Large-v3 AST — English subtitles</strong>
  <span>Japanese audio → English text</span>
  <span id="status">connecting…</span>
</header>
<main id="lines"><div id="empty">Waiting for speech…</div></main>
<script>
(() => {
  const lines = document.getElementById("lines");
  const status = document.getElementById("status");
  const maxLines = 3;
  const events = new EventSource("/events");
  function clock(seconds) {
    const s = Math.max(0, Math.floor(Number(seconds) || 0));
    const m = Math.floor(s / 60);
    return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  events.onopen = () => { status.textContent = "connected"; };
  events.onerror = () => { status.textContent = "reconnecting…"; };
  events.onmessage = event => {
    let sub;
    try { sub = JSON.parse(event.data); } catch (_) { return; }
    if (!sub || !sub.en || !sub.en.trim()) return;
    document.getElementById("empty")?.remove();
    const cue = document.createElement("div");
    cue.className = "cue";
    const stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.textContent = clock(sub.start_s) + " – " + clock(sub.end_s);
    const en = document.createElement("div");
    en.className = "en";
    en.textContent = sub.en;
    cue.append(stamp, en);
    lines.prepend(cue);
    while (lines.children.length > maxLines) lines.lastElementChild.remove();
  };
})();
</script>
</body>
</html>
